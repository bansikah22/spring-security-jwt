name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Maven 4
        run: |
          archive=apache-maven-4.0.0-rc-6-bin.tar.gz
          base_url=https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-6/binaries
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          expected_checksum=$(curl --fail --location --silent --show-error "$base_url/$archive.sha512")
          actual_checksum=$(sha512sum "$archive" | awk '{print $1}')
          test "$actual_checksum" = "$expected_checksum"
          tar --extract --file=apache-maven-4.0.0-rc-6-bin.tar.gz --directory="$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-4.0.0-rc-6/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Build container image
        run: docker build --tag secure-portal:ci .
      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-portal:ci
          version: v0.74.0
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/dependency-review-action@5638b39c36d266f2e2db96cc06e6cc9582c221cb # v4.7.3