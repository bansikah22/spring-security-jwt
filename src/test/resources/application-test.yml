spring:
  datasource:
    url: jdbc:h2:mem:secureportal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  thymeleaf:
    cache: false

security:
  jwt:
    issuer: https://secure-portal.test
    audience: secure-portal-api
    access-token-ttl: PT5M
    refresh-token-ttl: PT1H
  cors:
    allowed-origins: http://localhost:58081