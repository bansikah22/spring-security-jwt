<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Security | SecurePortal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{layout/navigation :: authenticated-navigation}"></div><main><p class="eyebrow">Live security context</p><h1>Authorization at a glance</h1><dl class="details"><dt>Authenticated user</dt><dd th:text="${username}">user</dd><dt>Authentication type</dt><dd th:text="${authenticationType}">type</dd></dl><section class="authority-grid"><article><h2>Roles</h2><p>Roles group related permissions.</p><ul><li th:each="role : ${roles}" th:text="${role}">USER</li><li th:if="${#lists.isEmpty(roles)}">No roles</li></ul></article><article><h2>Permissions</h2><p>Permissions control individual actions.</p><ul><li th:each="permission : ${permissions}" th:text="${permission}">PROFILE_READ</li><li th:if="${#lists.isEmpty(permissions)}">No permissions</li></ul></article></section></main></body></html>
