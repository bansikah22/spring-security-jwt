<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SecurePortal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main><h1>SecurePortal</h1><p>Session and JWT security demonstration.</p><nav><a th:href="@{/login}" sec:authorize="isAnonymous()">Sign in</a><a th:href="@{/dashboard}" sec:authorize="isAuthenticated()">Dashboard</a><a th:href="@{/security}" sec:authorize="isAuthenticated()">Security</a><a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Administration</a></nav><form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()"><button type="submit">Sign out</button></form></main></body>
</html>
