<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | SecurePortal</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main><h1>Sign in</h1><p th:if="${param.error}" class="error">Invalid username or password.</p><p th:if="${param.logout}">You have signed out.</p><form th:action="@{/login}" method="post"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><a th:href="@{/}">Home</a></main></body>
</html>
