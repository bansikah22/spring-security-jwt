apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-portal
  labels:
    app.kubernetes.io/name: secure-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secure-portal
          image: ghcr.io/bansikah22/spring-security-jwt:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: secure-portal-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secure-portal-secrets
                  key: database-password
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/run/secrets/secure-portal
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: jwt-keys
          secret:
            secretName: secure-portal-secrets
            defaultMode: 0400
            items:
              - key: jwt-public-key.pem
                path: public.pem
              - key: jwt-private-key.pem
                path: private.pem
        - name: tmp
          emptyDir: {}