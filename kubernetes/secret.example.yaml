# Do not apply this file or commit real secret values. Provision the referenced Secret through your secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: secure-portal-secrets
type: Opaque
stringData:
  database-password: replace-with-secret-manager-value
  jwt-public-key.pem: |
    -----BEGIN PUBLIC KEY-----
    replace-with-x509-rsa-public-key
    -----END PUBLIC KEY-----
  jwt-private-key.pem: |
    -----BEGIN PRIVATE KEY-----
    replace-with-pkcs8-rsa-private-key
    -----END PRIVATE KEY-----