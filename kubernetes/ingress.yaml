apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-portal
  labels:
    app.kubernetes.io/name: secure-portal
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portal.example.com
      secretName: secure-portal-tls
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure-portal
                port:
                  name: http